  <!--

  <style>
    /* ================= PART 2: CSS ================= */

    /* TODO 10: Style the body
       - font-family: Arial, sans-serif
       - max-width: 600px
       - margin: 0 auto (centers the page)
       - padding: 20px
       - background-color: #f5f5f5
    */
    /* YOUR CODE HERE */
   body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin:0 auto; 
      padding:20px;
      background-color: #f5f5f5;
   }
    /* TODO 11: Style the h1
       - color: #333
       - text-align: center
    */
    /* YOUR CODE HERE */
   h1 {
      color: #333;
      text-align: center;
   }
    /* TODO 12: Style the form (make it a white card)
       - background-color: white
       - padding: 25px
       - border-radius: 8px
       - box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1)
    */

   form {
      background-color: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
   }
    /* TODO 13: Style fieldset
       - border: 1px solid #ddd
       - border-radius: 5px
       - padding: 15px
       - margin: 15px 0
       - background-color: #fafafa
    */

   fieldset {
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 15px;
      margin: 15px 0;
      background-color: #fafafa;
   }
    /* TODO 14: Style legend
       - font-weight: bold
       - font-size: 1.1rem
       - color: #333
       - padding: 0 8px
    */
    /* YOUR CODE HERE */
    legend {
      font-weight: bold;
      font-size: 1.1rem;
      color: #333;
      padding:0 8px;
    }

    /* TODO 15: Style label (each label on its own line, above its box)
       - display: block
       - margin-top: 10px
       - margin-bottom: 5px
       - font-weight: bold
       - color: #333
    */
    /* YOUR CODE HERE */
    label {
      display:block;
      margin-top: 10px;
      margin-bottom: 5px;
      font-weight: bold;
      color:#333;
    }

    /* TODO 16: Make the radio and checkbox labels plain
       - Select the class .choice
       - font-weight: normal
    */
    /* YOUR CODE HERE */
    .choice {
      font-weight: normal;
    }

    /* TODO 17: Style the text-style boxes, the dropdown, and the textarea.
       Use this selector list (NOT radio or checkbox):
         input[type="text"], input[type="email"], input[type="password"],
         input[type="tel"], input[type="number"], input[type="date"],
         select, textarea
       - width: 100%
       - padding: 10px
       - border: 1px solid #ccc
       - border-radius: 4px
       - font-size: 1rem
       - font-family: inherit
       - box-sizing: border-box
    */
    /* YOUR CODE HERE */
    input[type="text"], input[type="email"], input[type="password"], input[type="tel"], input[type="number"], input[type="date"], select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc; 
      border-radius: 4px;
      font-size: 1rem;
      font-family: inherit;
      box-sizing: border-box;
    }

    /* TODO 18: Style the :focus state
       Selector list: input:focus, select:focus, textarea:focus
       - outline: none
       - border-color: #007bff
       - box-shadow: 0 0 5px rgba(0, 123, 255, 0.4)
    */
    /* YOUR CODE HERE */

    /* TODO 19: Style the buttons
       a) .button-group
          - text-align: center
          - margin-top: 20px
       b) button
          - padding: 12px 20px
          - margin: 5px
          - border: none
          - border-radius: 4px
          - font-size: 1rem
          - font-weight: bold
          - cursor: pointer
          - background-color: #007bff
          - color: white
          - transition: background-color 0.3s ease
       c) button:hover
          - background-color: #0056b3
       d) button[type="reset"]
          - background-color: #6c757d
       e) button[type="reset"]:hover
          - background-color: #545b62
    */
    /* YOUR CODE HERE */

    /* TODO 20: Add a media query for small screens
       @media (max-width: 600px)
         button:
           - display: block
           - width: 100%
           - margin: 10px 0
    */
    /* YOUR CODE HERE */
  </style>

<body>

  <h1>Summer Coding Camp Registration</h1>

  <!-- ================= PART 1: HTML ================= -->

  <!-- TODO 1: Start the form
       - id="camp-form"
       - action="#"   (we have no server yet, so "#" sends it back to this page)
       - method="get" (so you can see the answers in the address bar)
       Everything in TODO 2 - TODO 8 goes INSIDE this form.
  -->
  <!-- YOUR CODE HERE -->
   <form id="camp-form" action="#" method="get">

    <!-- TODO 2: Make a fieldset with the legend "Camper Information".
         Inside it, add a label + input for each row below.
         Every label's for must match its input's id.
         Every input needs a name (use the same word as the id).

         Label text       type       id / name    other attributes
         -----------      --------   ----------   -------------------------------------
         Full Name:       text       fullName     placeholder="First and last name" required
         Email Address:   email      email        placeholder="you@example.com" required
         Password:        password   password     placeholder="At least 8 characters" minlength="8" required
         Phone:           tel        phone        placeholder="330-555-0100"
         Age:             number     age          min="13" max="18"
         Start Date:      date       startDate    required
    -->
    <!-- YOUR CODE HERE -->
     <fieldset>
      <legend>Camper Information</legend>
      <label for="name">Full Name:</label>
      <input type="text" id="fullname" placeholder="First and last name" required>
      <br>
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" required>
      <br>
      <label for="password">Password:</label>
      <input type="password" id="password" placeholder="At least 8 characters" minlength="8" required>
      <br>
      <label for="tel">Phone</label>
      <input type="tel" id="phone" placeholder="300-555-0100">
      <br>
      <label for="age">Age:</label>
      <input type="number" id="age" min="13" max="18">
      <br>
      <label for="date">Start Date</label>
      <input type=date" id=startDate" required>
     </fieldset>

    <!-- TODO 3: Make a fieldset with the legend "T-Shirt Size".
         Add 4 radio buttons. Put each <input> INSIDE its <label>,
         and give each label class="choice".
         - All 4 use name="shirtSize"
         - Values and label text: small (Small), medium (Medium),
           large (Large), xlarge (X-Large)
         - Put required on the first radio button
    -->
    <!-- YOUR CODE HERE -->
     <fieldset>
      <legend>T-Shirt Size</legend>
      <input type="radio" name="shirtSize">
      <label class="choice">Small</label>
      <input type="radio" name="shirtSize">
      <label class="choice">Medium</label>
      <input type="radio" name="shirtSize">
      <label class="choice">Large</label>
      <input type="radio" name="shirtSize">
      <label class="choice">X-Large</label>
      <input type="radio" name="shirtSize">
     </fieldset>

    <!-- TODO 4: Make a fieldset with the legend "What do you want to learn?".
         Add 5 checkboxes. Put each <input> INSIDE its <label>,
         and give each label class="choice".
         - All 5 use name="topics"
         - Values and label text: html (HTML and CSS), javascript (JavaScript),
           python (Python), games (Game Design), robots (Robotics)
    -->
    <!-- YOUR CODE HERE -->
     <fieldset>
      <legend>What do you want to learn?</legend>
      <label for="html">HTML and CSS</label>
      <input type="checkbox" name="topics" class="choice">
      <br>
      <label for="javascript">JavaScript</label>
      <input type="checkbox" name="topics" class="choice">
      <br>
      <label for="python">Python</label>
      <input type="checkbox" name="topics" class="choice">
      <br>
      <label for="games">Game Design</label>
      <input type="checkbox" name="topics" class="choice">
      <br>
      <label for="robots">Robotics</label>
      <input type="checkbox" name="topics" class="choice">
     </fieldset>

    <!-- TODO 5: Make a fieldset with the legend "Contact and Comments".
         a) A label "Best way to reach you:" and a select with id="contact" and name="contact".
            Options (value / text):
              ""     / -- Choose one --
              email  / Email
              phone  / Phone call
              text   / Text message
              mail   / Postal mail
            Put required on the select.
         b) A label "Anything else we should know?" and a textarea with
            id="comments", name="comments", rows="5", cols="40",
            maxlength="500", placeholder="Allergies, questions, or anything else"
    -->
    <!-- YOUR CODE HERE -->
     <fieldset>
      <legend>Contacts and Comments</legend>
      <label for="contact">Best way to reach you:</label>
      <select id="contact" name="contact">
         <option value="">-- Choose one --</option>
         <option value="email">Email</option>
         <option value="phone">Phone call</option>
         <option value="text">Text message</option>
         <option value="mail">Postal Mail</option>
      </select>
      <label>Anything else we should know?</label>
      <textarea id="comments" name="comments" rows="5" cols="40" maxlength="500" placeholder="Allergies, questions, or anyting else"></textarea>
     </fieldset>

    <!-- TODO 6: After the last fieldset, add a div with class="button-group".
         Inside it put:
         - a submit button with the text "Register"
         - a reset button with the text "Clear Form"
    -->
    <!-- YOUR CODE HERE -->
     <div class="button-group">
      <button type="submit">Register</button>
      <button type="reset">Clear Form</button>
     </div>

    <!-- TODO 7: Tab order.
         The link below has tabindex="1", so the Tab key jumps to it FIRST,
         before any form box. Press Tab from the top of the page to see it.
         Remove tabindex="1" so the link is reached in normal order.
         (Keep the link. Just delete the tabindex attribute.)
    -->
    <p><a href="mailto:camp@example.com">Questions? Email the camp director.</a></p>

  <!-- TODO 8: Close the form -->
  <!-- YOUR CODE HERE -->
            </form>

       a) it gives it a name so then you can't select the same thing twice or smth

       e) Because then you're just outing your poor user's password.

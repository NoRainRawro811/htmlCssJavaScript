<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables Test</title>
<style>
table, td, th {
    border: 5px
    solid black;
    text-align: center;
}
table {
    background-color: red;
}
th, td {
    padding: 30px
}
.day {
    background-color: aqua;
}
td {
    background-color: yellow;
}
.daydiff {
    background-color: pink;
}



</style>
</head>
<body>
    <h1>Lunch Menu</h1>
    <table>
        <caption><u><h2>Weekly Lunch Menu</h2></u></caption>
        <tr class="day">
            <th>Day</th>
            <th>Main</th>
            <th>Side</th>
        </tr>
        <tr>
            <td class="daydiff">Monday</td>
            <td class="other">Chicken alfredo</td>
            <td class="other">Salsa dancing</td>
        </tr>
        <tr>
            <td class="daydiff">Tuesday</td>
            <td>Pizza</td>
            <td>Salad</td>
        </tr>
        <tr>
            <td class="daydiff">Wednesday</td>
            <td>Mexican corpses</td>
            <td>Alfredo salsa</td>
        </tr>
        <tr>
            <td class="daydiff">Thursday</td>
            <td>Tour guide blood</td>
            <td>Giant's hangnail</td>
        </tr>
        <tr>
            <td class="daydiff">Friday</td>
            <td colspan="2">No School - Holiday</td>
        </tr>
    </table>
</body>
</html>

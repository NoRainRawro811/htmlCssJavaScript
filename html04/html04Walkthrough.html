<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Headphones</title>
  <!-- The block below is CSS. It only draws borders on tables so you can
       see rows and cells. CSS is Lesson 05 - leave this alone for now. -->
       <!-- border: adds a 1px solid dark line around the table and cells -->
  <!-- border-collapse: merges double cell borders into a single clean line -->
  <!-- padding: adds 6px of inner space between cell borders and text -->
  <style>
    table, th, td { border: 1px solid #333; border-collapse: collapse; }
    th, td { padding: 6px; }
  </style>
</head>
<body>

  <header>
    <h1>Premium Headphones</h1>
    <p>Explore our premium product lineup</p>
  </header>

  <!-- You'll add image gallery here -->
<section id="gallery">
    <h2>Product Gallery</h2>
    <figure>
        <img src="images/product-view-1.jpg" alt="Front view of wireless headphones" style="max-width: 100%; height: auto;">
        <figcaption>Front view of the wireless headphones</figcaption>
    </figure>

    <figure>
        <img src="images/product-view-2.jpg" alt="Front view of wired headphones" style="max-width: 100%; height: auto;">
        <figcaption>Front view of the wired headphones</figcaption>
    </figure>

    <figure>
        <img src="images/product-view-3.jpg" alt="Front view of wireless headphones hanging" style="max-width: 100%; height: auto;">
        <figcaption>Front view of the wireless headphones hanging</figcaption>
    </figure>

</section>

</html>
